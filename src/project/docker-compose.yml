services:
  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    ports:
      - "${VLLM_PORT}:${VLLM_PORT}"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${VLLM_VISIBLE_DEVICES}
    #volumes:
    #  - ./models:/models  # Optional: for local models
    command: >
      --model ${VLLM_MODEL}
      --host 0.0.0.0
      --port ${VLLM_PORT}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE}
      --max-model-len ${VLLM_MAX_MODEL_LEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  streamlit:
    build: .
    ports:
      - "7777:7777"
    environment:
      - API_URL=http://vllm:${VLLM_PORT}/v1/chat/completions
    volumes:
      - .:/app
    depends_on:
      vllm:
        condition: service_healthy

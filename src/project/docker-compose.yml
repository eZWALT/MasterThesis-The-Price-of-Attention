services:
  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    ports:
      - "${VLLM_PORT}:${VLLM_PORT}"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${VLLM_VISIBLE_DEVICES}
    #volumes:
    #  - ./models:/models  # Optional: for local models
    command: >
      --model ${VLLM_MODEL}
      --host 0.0.0.0
      --port ${VLLM_PORT}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE}
      --max-model-len ${VLLM_MAX_MODEL_LEN}

  streamlit:
    build: .
    ports:
      - "7777:7777"
    volumes:
      - .:/app
    depends_on:
      - vllm

# ─────────────────────────────────────────────────────────────────────────────
# ollama_cluster.conf  —  nginx config for Ollama multi-GPU cluster
#
# Round-robins /api/chat requests across N Ollama instances, one per GPU.
# Streamlit's LLMClient still points at http://localhost:{CLUSTER_PORT}
# and nginx distributes the load.
#
# Usage
# -----
# Replace {CLUSTER_PORT} and {OLLAMA_PORTS} with actual values:
#   sed "s/{CLUSTER_PORT}/9999/g; s/{OLLAMA_PORTS}/localhost:9991 localhost:9992/g" \
#     ollama_cluster.conf > /etc/nginx/sites-available/ollama_cluster
#
# Or embed inline in start_ollama_cluster.sh (recommended).
# ─────────────────────────────────────────────────────────────────────────────
upstream ollama_backends {
    least_conn;
    # ── One server entry per Ollama instance ──
    # {OLLAMA_PORTS}
}

server {
    listen {CLUSTER_PORT};

    # ── Increase timeouts for long generations ──
    proxy_connect_timeout       600;
    proxy_send_timeout          600;
    proxy_read_timeout          600;
    send_timeout                600;

    # ── SSE streaming support ──
    proxy_buffering             off;
    proxy_cache                 off;
    proxy_set_header            Connection '';
    chunked_transfer_encoding   on;

    # ── API chat endpoint (used by LLMClient._chat_ollama) ──
    location /api/chat {
        proxy_pass http://ollama_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── All other Ollama API endpoints pass through ──
    location /api/ {
        proxy_pass http://ollama_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

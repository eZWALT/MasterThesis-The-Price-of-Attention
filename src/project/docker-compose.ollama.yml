services:
  streamlit:
    network_mode: host
    build: .
    env_file:
      - .env
    environment:
      - API_URL=http://localhost:${OLLAMA_PORT}/v1/chat/completions
      - DEFAULT_MODEL=${OLLAMA_MODEL}
      - LLM_BACKEND=ollama
      - OLLAMA_API_BASE=http://localhost:${OLLAMA_PORT}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-16384}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      - LLM_THINK=${LLM_THINK:-false}
      - HF_HOME=/app/.hf_cache
    volumes:
      - .:/app
      - hf_cache:/app/.hf_cache

volumes:
  hf_cache:

services:

  vllm:
    image: vllm/vllm-openai:v0.8.5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${VLLM_PORT}:${VLLM_PORT}"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${VLLM_VISIBLE_DEVICES}
      - CUDA_VISIBLE_DEVICES=${VLLM_VISIBLE_DEVICES}
    #volumes:
    #  - ./models:/models  # Optional: for local models
    command: >
      --model ${VLLM_MODEL}
      --host 0.0.0.0
      --port ${VLLM_PORT}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE}
      --max-model-len ${VLLM_MAX_MODEL_LEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s





  streamlit:
    build: .
    ports:
      - "${STREAMLIT_PORT}:${STREAMLIT_PORT}"
      - "${AD_CLICK_SERVER_PORT}:${AD_CLICK_SERVER_PORT}"
    env_file:
      - .env
    environment:
      - API_URL=http://vllm:${VLLM_PORT}/v1/chat/completions
      - DEFAULT_MODEL=${VLLM_MODEL}
      - LLM_BACKEND=openai
      - HF_HOME=/app/.hf_cache
    volumes:
      - .:/app
      - hf_cache:/app/.hf_cache
    depends_on:
      vllm:
        condition: service_healthy

volumes:
  hf_cache:
